name: Notify Dependents

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scratch-gui update
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.AUTOMATION }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/Nitro-Bolt/scratch-gui/dispatches \
            -d '{"event_type":"upstream-updated","client_payload":{"source":"scratch-vm"}}'

      - name: Trigger packager update
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.AUTOMATION }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/Nitro-Bolt/packager/dispatches \
            -d '{"event_type":"upstream-updated","client_payload":{"source":"scratch-vm"}}'
