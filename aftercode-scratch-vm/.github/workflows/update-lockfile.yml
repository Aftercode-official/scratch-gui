name: Update lock file

on:
  workflow_dispatch:

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: git config user.name "GitHub Action"
      - run: git config user.email "action@github.com"
      - run: pnpm install
      - run: git diff --quiet pnpm-lock.yaml package.json || (git add pnpm-lock.yaml package.json && git commit -m "Update pnpm-lock.yaml" && git push)
